version: 1.3.3

cache: true

interface:
  customWelcome: 'Welcome to Simple AI - Test - Digital Automations. Enjoy your experience.'
  fileSearch: true
  webSearch: true
  privacyPolicy:
    externalUrl: ''
    openNewTab: true
  termsOfService:
    externalUrl: ''
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Terms of Service'
    modalContent: |
      # Per i termini di utilizzo si rimanda al contratto generale
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: true
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: true
  fileCitations: true

registration:
  socialLogins: []
  allowedDomains:
    - "digitalautomations.it"

balance:
  enabled: true
  startBalance: 1000000000
  autoRefillEnabled: false
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 1000000000

transactions:
  enabled: true


fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - application/pdf
        - text/plain
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/msword
        - application/vnd.ms-excel
        - application/vnd.ms-powerpoint
        - text/csv
    agents:
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - application/pdf
        - text/plain
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/msword
        - application/vnd.ms-excel
        - application/vnd.ms-powerpoint
        - text/csv
  serverFileSizeLimit: 100
  avatarSizeLimit: 2

actions:
  allowedDomains:
    - "https://n8n.digitalautomations.it"


mcpServers:
  odoo-ai:
    type: streamable-http
    url: https://odoo-api-champions.digitalautomations.it/mcp
    headers:
      Authorization: "Bearer {{ODOO_AI_API_KEY}}"
    customUserVars:
      ODOO_AI_API_KEY:
        title: "Odoo AI API Key"
        description: "User specific Odoo AI API Key"
  gmail:
    title: "Gmail"
    description: "Cerca e legge le email e salva bozze nella casella Gmail dell'utente. Non invia email."
    type: streamable-http
    url: http://gmail-mcp:8000/mcp
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
      token_url: https://oauth2.googleapis.com/token
      client_id: "${GMAIL_OAUTH_CLIENT_ID}"
      client_secret: "${GMAIL_OAUTH_CLIENT_SECRET}"
      scope: "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose"
      token_exchange_method: default_post

mcpSettings:
  allowedAddresses:
    - "gmail-mcp:8000"


endpoints:

  azureOpenAI:
    titleModel: gpt-5
    plugins: true
    groups:
      - group: "Default"
        apiKey: "${AZURE_INSTANCE_KEY}"
        instanceName: "${AZURE_INSTANCE_NAME}"
        version: "${AZURE_API_VERSION}"
        models:
          "gpt-chat-latest":
            deploymentName: gpt-chat-latest
          "gpt-5.4":
            deploymentName: gpt-5.4
          "gpt-5.4-mini":
            deploymentName: gpt-5.4-mini
          "gpt-5.4-nano":
            deploymentName: gpt-5.4-nano
          "gpt-5.3-chat":
            deploymentName: gpt-5.3-chat
          "gpt-5.2-chat":
            deploymentName: gpt-5.2-chat
          "gpt-5.2":
            deploymentName: gpt-5.2
          "gpt-5.1":
            deploymentName: gpt-5.1
          "gpt-5":
            deploymentName: gpt-5

  google:
    streamRate: 5
    titleModel: "gemini-2.5-flash"

  anthropic:
    streamRate: 20
    titleModel: "claude-haiku-4-5"
    titleMethod: "completion"
    vertex:
      region: "global"
      projectId: "simple-ai-saas-5"
      serviceKeyFile: "/api/data/auth.json"
      models:
        "claude-sonnet-5":
          deploymentName: claude-sonnet-5
        "claude-fable-5":
          deploymentName: claude-fable-5
        "claude-opus-4-8":
          deploymentName: claude-opus-4-8
        "claude-opus-4-7":
          deploymentName: claude-opus-4-7
        "claude-opus-4-6":
          deploymentName: claude-opus-4-6
        "claude-opus-4-5":
          deploymentName: claude-opus-4-5
        "claude-sonnet-4-6":
          deploymentName: claude-sonnet-4-6
        "claude-sonnet-4-5":
          deploymentName: claude-sonnet-4-5
        "claude-haiku-4-5":
          deploymentName: claude-haiku-4-5

  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ["execute_code", "file_search", "web_search", "artifacts", "actions", "tools", "context", "chain", "ocr"]

webSearch:
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searchProvider: "searxng"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  scraperProvider: "firecrawl"
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"
  rerankerType: "jina"
  safeSearch: 1
  scraperTimeout: 5000

modelSpecs:
  prioritize: true
  # enforce resta false: con modelSelect/presets/parameters attivi entrerebbe in conflitto
  enforce: false
  # Solo gli endpoint elencati restano navigabili come tali; i provider coperti dagli
  # spec spariscono dal selettore, eliminando i doppioni col nome tecnico del modello.
  addedEndpoints:
    - agents

  # Esposti: 3 per provider (migliore / equilibrato / economico), 8 voci in tutto.
  # Le mappe "models:" degli endpoint restano COMPLETE: gli agenti e le conversazioni
  # storiche continuano a risolvere qualunque modello configurato, anche se non compare
  # qui. NON rimuovere voci dalla mappa di azureOpenAI: mapModelToAzureConfig lancia
  # 'Model named "X" not found in configuration.' e ogni agente fissato su quel modello
  # si rompe. Su Vertex il comportamento è invece passthrough e non rompe nulla.
  list:
    - name: opus-4-8
      label: Opus 4.8
      description: "Il modello Anthropic più capace: analisi complesse e ragionamento profondo"
      group: Anthropic
      groupIcon: anthropic
      iconURL: anthropic
      order: 10
      preset:
        endpoint: anthropic
        model: claude-opus-4-8
    - name: sonnet-5
      label: Sonnet 5
      description: "Ultima generazione Sonnet — solo chat: non usare con agenti o strumenti"
      group: Anthropic
      groupIcon: anthropic
      iconURL: anthropic
      order: 11
      preset:
        endpoint: anthropic
        model: claude-sonnet-5
      softDefault: true
    - name: haiku-4-5
      label: Haiku 4.5
      description: "Il più rapido ed economico: ideale per compiti brevi e ripetitivi"
      group: Anthropic
      groupIcon: anthropic
      iconURL: anthropic
      order: 12
      preset:
        endpoint: anthropic
        model: claude-haiku-4-5
    - name: gpt-5.4
      label: GPT-5.4
      description: Modello OpenAI di punta per compiti generali
      group: Azure OpenAI
      groupIcon: azureOpenAI
      iconURL: azureOpenAI
      order: 20
      preset:
        endpoint: azureOpenAI
        model: gpt-5.4
    - name: gpt-5.4-mini
      label: GPT-5.4 Mini
      description: Versione più leggera e rapida di GPT-5.4
      group: Azure OpenAI
      groupIcon: azureOpenAI
      iconURL: azureOpenAI
      order: 21
      preset:
        endpoint: azureOpenAI
        model: gpt-5.4-mini
    - name: gemini-3-1-pro
      label: Gemini 3.1 Pro
      description: Il modello Google più capace — in preview
      group: Google
      groupIcon: google
      iconURL: google
      order: 30
      preset:
        endpoint: google
        model: gemini-3.1-pro-preview
    - name: gpt-5.4-reasoning
      label: GPT-5.4 Reasoning
      description: GPT-5.4 con ragionamento avanzato attivo
      group: Azure OpenAI
      groupIcon: azureOpenAI
      iconURL: azureOpenAI
      order: 22
      preset:
        endpoint: azureOpenAI
        model: gpt-5.4
        useResponsesApi: true
        reasoning_effort: high
        reasoning_summary: concise
    - name: gemini-3-flash
      label: Gemini 3 Flash
      description: Rapido ed economico — in preview
      group: Google
      groupIcon: google
      iconURL: google
      order: 31
      preset:
        endpoint: google
        model: gemini-3-flash-preview

