version: 1.3.3

cache: true

interface:
  customWelcome: 'Welcome to Simple AI - Test - Digital Automations. Enjoy your experience.'
  fileSearch: true
  webSearch: true
  privacyPolicy:
    externalUrl: ''
    openNewTab: true
  termsOfService:
    externalUrl: ''
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Terms of Service'
    modalContent: |
      # Per i termini di utilizzo si rimanda al contratto generale
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  # share/public NON scritti: la condivisione la decide la casella "Shared Agents"
  # della GUI (scrive i permessi sul documentale). Le sotto-voci omesse restano
  # quelle salvate nel database (doc ufficiale interface), quindi la GUI prevale
  # sul valore predefinito del file ufficiale. Vale per LibreChat >= 0.8.8 e Simple AI.
  agents:
    use: true
    create: true
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: true
  fileCitations: true
  # Rotella del contesto nascosta: resta l'avviso sopra la casella dal 45% (Dettagli apre il riepilogo).
  contextGauge: false

registration:
  socialLogins: []
  allowedDomains:
    - "digitalautomations.it"

balance:
  enabled: true
  startBalance: 1000000000
  autoRefillEnabled: false
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 1000000000

transactions:
  enabled: true


fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - application/pdf
        - text/plain
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/msword
        - application/vnd.ms-excel
        - application/vnd.ms-powerpoint
        - text/csv
    agents:
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - application/pdf
        - text/plain
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/msword
        - application/vnd.ms-excel
        - application/vnd.ms-powerpoint
        - text/csv
  serverFileSizeLimit: 100
  avatarSizeLimit: 2

actions:
  allowedDomains:
    - "https://n8n.digitalautomations.it"
    - "https://sgo.digaut.it"

endpoints:

  azureOpenAI:
    titleModel: gpt-5
    plugins: true
    groups:
      - group: "Default"
        apiKey: "${AZURE_INSTANCE_KEY}"
        instanceName: "${AZURE_INSTANCE_NAME}"
        version: "${AZURE_API_VERSION}"
        models:
          "gpt-6-luna":
            deploymentName: gpt-6-luna
          "gpt-6.1-sol":
            deploymentName: gpt-6.1-sol
          "gpt-6-astra":
            deploymentName: gpt-6-astra
          "gpt-5.6-terra":
            deploymentName: gpt-5.6-terra
          "gpt-chat-latest":
            deploymentName: gpt-chat-latest

  google:
    streamRate: 5
    titleModel: "gemini-2.5-flash"

  anthropic:
    streamRate: 20
    titleModel: "claude-haiku-4-5"
    titleMethod: "completion"
    vertex:
      region: "global"
      projectId: "simple-ai-saas-5"
      serviceKeyFile: "/api/data/auth.json"
      models:
        "claude-haiku-5-5":
          deploymentName: claude-haiku-5-5
        "claude-sonnet-5-5":
          deploymentName: claude-sonnet-5-5
        "claude-opus-5-5":
          deploymentName: claude-opus-5-5
        "claude-fable-5-1":
          deploymentName: claude-fable-5-1

  # Regolo: un fornitore per modello, ognuno con la propria chiave (consumi
  # separati per macchina e modello). Le chiavi stanno solo nelle variabili.
  custom:
    - name: "GLM 5.2"
      apiKey: "${REGOLO_KEY_GLM5_2}"
      baseURL: "https://api.regolo.ai/v1"
      models:
        default: ["glm5.2"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "GLM 5.2"
    - name: "Qwen 3.5 122B"
      apiKey: "${REGOLO_KEY_QWEN3_5_122B}"
      baseURL: "https://api.regolo.ai/v1"
      models:
        default: ["qwen3.5-122b"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Qwen 3.5 122B"
    - name: "Qwen 3.8 27B"
      apiKey: "${REGOLO_KEY_QWEN3_8_27B}"
      baseURL: "https://api.regolo.ai/v1"
      models:
        default: ["qwen3.8-27b"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Qwen 3.8 27B"

  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ["execute_code", "file_search", "web_search", "artifacts", "actions", "tools", "context", "chain", "ocr"]

# Voci di menu dei modelli Regolo, riunite nel gruppo "Open source".
# prioritize false: le nuove chat NON partono forzatamente su un modello Regolo.
# enforce false: gli altri fornitori restano selezionabili.
# addedEndpoints: fornitori mostrati accanto al gruppo. I fornitori Regolo
# dedicati (uno per modello) non sono elencati, quindi non compaiono come voci
# dirette: si raggiungono solo dal gruppo.
# Scheda "Crea" del pannello agenti: spec usata per generare la configurazione dell'agente.
agentBuilder:
  spec: auto-sonnet

# Ripiego automatico: se un modello va in rate limit, sovraccarico o errore 5xx prima di
# rispondere, la stessa richiesta passa a un altro modello della stessa fascia, poi di quelle
# superiori. Fasce dalla più bassa alla più alta, con i `name` delle modelSpecs.
modelFallback:
  tiers:
    - [auto-haiku, auto-luna]
    - [auto-sonnet, auto-astra]
    - [auto-opus, auto-sol]

modelSpecs:
  enforce: false
  prioritize: false
  addedEndpoints:
    - azureOpenAI
    - google
    - anthropic
    - agents
  list:
    # Router automatico: Jev (TypeSafe) sceglie modello e strumenti a ogni messaggio.
    # Serve TYPESAFE_API_KEY nel .env; senza chiave, o se Jev non risponde, usa `fallback`.
    # Le nuove chat partono in automatico; l'utente lo spegne dal toggle nella barra della chat.
    - name: auto
      label: Automatico
      description: "Sceglie da solo il modello più adatto alla richiesta"
      iconURL: anthropic
      default: true
      preset:
        endpoint: anthropic
        model: claude-sonnet-5-5
      router:
        fallback: auto-sonnet
        historyMessages: 5
        maxMessageChars: 2000
        timeoutMs: 4000
        candidates:
          auto-opus: "Fascia alta, Anthropic: analisi lunghe e complesse, ragionamento profondo, lavoro su molti documenti, scrittura accurata"
          auto-sol: "Fascia alta, OpenAI: problemi logici, matematici o di programmazione difficili che richiedono ragionamento passo passo"
          auto-sonnet: "Fascia media, Anthropic: scrittura, sintesi e analisi di media complessità"
          auto-astra: "Fascia media, OpenAI: compiti generali di media complessità"
          auto-haiku: "Fascia bassa, Anthropic: domande brevi, saluti, riformulazioni, traduzioni semplici"
          auto-luna: "Fascia bassa, OpenAI: domande brevi e fattuali, risposte rapide"
        tools:
          web_search: "ricerca sul web per informazioni recenti, notizie, prezzi o fatti che il modello potrebbe non conoscere"
          execute_code: "esecuzione di codice per calcoli, analisi di dati, grafici o creazione e conversione di file"
    # Candidati del router: nascosti dal menu, usati solo dalla modalità Automatico.
    - name: auto-opus
      label: Opus 5.5
      showInMenu: false
      iconURL: anthropic
      preset:
        endpoint: anthropic
        model: claude-opus-5-5
    - name: auto-sonnet
      label: Sonnet 5.5
      showInMenu: false
      iconURL: anthropic
      preset:
        endpoint: anthropic
        model: claude-sonnet-5-5
    - name: auto-haiku
      label: Haiku 5.5
      showInMenu: false
      iconURL: anthropic
      preset:
        endpoint: anthropic
        model: claude-haiku-5-5
    - name: auto-sol
      label: GPT-6.1 Sol
      showInMenu: false
      iconURL: azureOpenAI
      preset:
        endpoint: azureOpenAI
        model: gpt-6.1-sol
    - name: auto-astra
      label: GPT-6 Astra
      showInMenu: false
      iconURL: azureOpenAI
      preset:
        endpoint: azureOpenAI
        model: gpt-6-astra
    - name: auto-luna
      label: GPT-6 Luna
      showInMenu: false
      iconURL: azureOpenAI
      preset:
        endpoint: azureOpenAI
        model: gpt-6-luna
    - name: glm5-2
      label: "GLM 5.2"
      description: "(openweight, EU): modello GLM generalista"
      group: "Open source"
      order: 40
      preset:
        endpoint: "GLM 5.2"
        model: "glm5.2"
    - name: qwen3-5-122b
      label: "Qwen 3.5 122B"
      description: "(openweight, EU): il pi\u00f9 capace della famiglia Qwen disponibile"
      group: "Open source"
      order: 41
      preset:
        endpoint: "Qwen 3.5 122B"
        model: "qwen3.5-122b"
    - name: qwen3-8-27b
      label: "Qwen 3.8 27B"
      description: "(openweight, EU): pi\u00f9 leggero e rapido"
      group: "Open source"
      order: 42
      preset:
        endpoint: "Qwen 3.8 27B"
        model: "qwen3.8-27b"

webSearch:
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searchProvider: "searxng"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  scraperProvider: "firecrawl"
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"
  rerankerType: "jina"
  safeSearch: 1
  scraperTimeout: 5000
  # SearXNG gira su Tailscale (100.x): senza eccezione la protezione SSRF di v0.8.8 lo blocca.
  allowedAddresses:
    - "100.116.255.59:8080"

mcpServers:
  odoo-ai:
    type: streamable-http
    url: https://odoo-api-champions.digitalautomations.it/mcp
    headers:
      Authorization: "Bearer {{ODOO_AI_API_KEY}}"
    customUserVars:
      ODOO_AI_API_KEY:
        title: "Odoo AI API Key"
        description: "User specific Odoo AI API Key"
  gmail:
    title: "Gmail"
    description: "Cerca e legge le email e salva bozze nella casella Gmail dell'utente. Non invia email."
    type: streamable-http
    url: http://gmail-mcp:8000/mcp
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
      token_url: https://oauth2.googleapis.com/token
      client_id: "${GMAIL_OAUTH_CLIENT_ID}"
      client_secret: "${GMAIL_OAUTH_CLIENT_SECRET}"
      scope: "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose"
      token_exchange_method: default_post

mcpSettings:
  allowedAddresses:
    - "gmail-mcp:8000"
