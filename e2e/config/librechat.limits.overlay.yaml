# Applied on top of librechat.e2e.yaml only when E2E_LIMITS=true (see writeRuntimeMockConfig).
# modelFallback builds each fallback from its spec preset: a spec on a custom endpoint needs
# `endpointType: custom`, otherwise the fallback is silently skipped ("Unknown endpoint").
modelFallback:
  tiers:
    - [e2e-mock-provider-a, e2e-mock-provider-b]

modelSpecs:
  list:
    - name: 'e2e-mock-provider-a'
      preset:
        endpointType: 'custom'
    - name: 'e2e-mock-provider-b'
      preset:
        endpointType: 'custom'
    - name: 'e2e-limits-small-context'
      label: 'E2E Limits Small Context'
      preset:
        endpoint: 'Mock Provider A'
        model: 'mock-model-a'
        maxContextTokens: 1100
    # G1: the base e2e-auto router talks to the fake jev (TYPESAFE_API_KEY is set only in the
    # limits server env, so the shared mock suite keeps exercising the missing-key path).
    - name: 'e2e-auto'
      router:
        baseURL: 'http://127.0.0.1:8793'
        timeoutMs: 1000

# E1a: summarization is only viable from ~1024 effective tokens (MIN_SUMMARIZATION_CONTEXT_TOKENS),
# so maxContextTokens is 1100 and each turn carries ~1200 characters (~300 tokens): four turns overflow.
summarization:
  enabled: true
  provider: 'Mock Provider A'
  reserveRatio: 0
  model: 'mock-model-a'
  retainRecent:
    turns: 1

# F2/F4: the fake action server is on loopback, so it needs both the domain allowlist
# (plain arrays are replaced by the merge: keep the base entry) and the SSRF exemption.
# The Action editor saves `metadata.domain` as protocol + hostname (port dropped), so the
# portless 127.0.0.1 / 127.0.0.1:80 entries are what let a schema edited in the UI be saved;
# the 8792 entries cover the Actions created through the API with the port.
actions:
  allowedDomains:
    - example.com
    - 127.0.0.1
    - 127.0.0.1:8792
  allowedAddresses:
    - 127.0.0.1:80
    - 127.0.0.1:8792
